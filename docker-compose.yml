services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # S9 — read credentials from .env with safe local defaults.
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    env_file:
      - .env
    # S9 — Postgres data persisted on a named volume so it survives
    # `docker compose down` / `up` cycles.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # B4 — single source of truth: provider + DATABASE_URL match schema.prisma.
      DATABASE_URL: postgresql://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-devflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Local Docker serves over plain http, so Secure cookies must be off here.
      # TLS-terminated production deployments should leave this unset (Secure by default).
      COOKIE_SECURE: "false"
      # Enables per-IP rate limits behind the compose proxy.
      TRUST_PROXY: "true"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
