name: Uptime

on:
  schedule:
    # every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    name: Check live endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        id: probe
        run: |
          failed=""
          for url in "https://devflow-black-eight.vercel.app" "https://devflow-black-eight.vercel.app/api/health"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            echo "$url -> $code"
            [ "$code" = "200" ] || failed="$failed $url($code)"
          done
          if [ -n "$failed" ]; then
            echo "FAILED=$failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "FAILED=" >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: steps.probe.outputs.FAILED != ''
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.probe.outputs.FAILED }}
        with:
          script: |
            const failed = process.env.FAILED || 'unknown';
            const title = `Uptime: endpoint down: ${failed.trim()}`;
            const body = [
              'Automated uptime check failed.',
              '',
              '```',
              failed.trim(),
              '```',
              '',
              `_Checked at ${new Date().toISOString()} by the uptime workflow._`
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['uptime']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body
              });
            }

      - name: Close issue when recovered
        if: steps.probe.outputs.FAILED == ''
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime'
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Endpoint is back to 200 — closing.'
              });
              await github.rest.issues.close({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number
              });
            }
