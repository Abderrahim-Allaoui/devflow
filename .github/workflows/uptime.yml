name: Uptime

on:
  schedule:
    # every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    name: Check live endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        id: probe
        run: |
          urls="https://devflow-black-eight.vercel.app https://devflow-license.vercel.app https://devflow-license.vercel.app/services.html https://devflow-license.vercel.app/order.html"
          failed=""
          for url in $urls; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo "000")
            echo "$url -> $code"
            [ "$code" = "200" ] || failed="$failed $url($code)"
          done
          echo "FAILED=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ] && echo "All endpoints healthy ✅" || echo "Down:$failed"

      - name: Open/close an issue when something is down
        if: steps.probe.outputs.FAILED != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failed = process.env.FAILED || '';
            const title = `⚠️ Live endpoint down: ${failed}`;
            const body = [
              'Automated uptime check failed.',
              '',
              '```',
              failed,
              '```',
              '',
              `_Checked at ${new Date().toISOString()} by the uptime workflow._`
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'uptime'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['uptime']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number,
              body: '✅ Back up — the endpoints answer 200 again.'
            });
            await github.rest.issues.close({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number
            });
