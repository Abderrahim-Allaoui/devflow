name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "file:./devflow.db"
  JWT_SECRET: "ci-only-secret-not-used-in-production-0123456789abcdef"
  COOKIE_SECURE: "false"

jobs:
  quality:
    name: Test · typecheck · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (SQLite + Postgres)
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.postgres.prisma

      - name: Apply schema (SQLite)
        run: npx prisma db push --skip-generate

      - name: Unit tests
        run: npm test

      - name: Migrations deploy on Postgres (throwaway DB)
        env:
          DATABASE_URL: postgresql://devflow:devflow@localhost:5432/devflow
        run: npx prisma migrate deploy --schema prisma/schema.postgres.prisma

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Dependency audit (high+ only)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t devflow-ci .
